name: Update Google Scholar Citations

on:
  schedule:
    # Every Monday at 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/update-citations.yml'
      - 'scripts/update_citations.py'

permissions:
  contents: write

concurrency:
  group: update-citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch & update citation count
        run: python3 scripts/update_citations.py

      - name: Commit if changed
        run: |
          if git diff --quiet index.html; then
            echo "No changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "chore: auto-update Google Scholar citation count"
            git push
          fi
